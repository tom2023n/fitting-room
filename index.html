<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="试衣间 — 点击或拖到模特身上，虚拟试穿外套与裤装。">
  <title>试衣间 · Fitting Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%23111' width='64' height='64' rx='12'/><text x='32' y='44' text-anchor='middle' font-size='36' fill='white' font-family='serif'>F</text></svg>">
  <link rel="preload" as="image" href="assets/model-camel-sand.jpg">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="./" aria-label="试衣间 首页">
      <span class="logo-en">Fitting Room</span>
      <span class="logo-zh">试衣间</span>
    </a>
    <p class="hint">两侧滑动，拖到模特身上，或点击单品试穿</p>
    <button type="button" class="cart-btn" id="cart-btn" aria-label="打开购物车，当前 0 件" aria-controls="cart-drawer" aria-expanded="false">
      <span class="cart-label">购物车</span>
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </header>

  <main class="stage">
    <div class="strip jackets-strip" id="jackets-strip" aria-label="外套"></div>

    <div class="model-wrap" id="model-wrap" data-drop="true">
      <div class="model-frame" id="model-frame">
        <img class="model-img is-visible" id="model-a" src="assets/model-camel-sand.jpg" alt="模特正穿着驼色灯芯绒羽绒服与沙色摇粒绒束脚裤">
        <img class="model-img" id="model-b" alt="" aria-hidden="true">
      </div>
      <p class="drop-hint" aria-hidden="true">松手即可试穿</p>
    </div>

    <div class="strip pants-strip" id="pants-strip" aria-label="裤装"></div>
  </main>

  <footer class="dock">
    <button type="button" class="chip" id="chip-jacket" title="将当前外套加入购物车">
      <span class="chip-k">外套</span>
      <span class="chip-v" id="jacket-name">驼色灯芯绒羽绒服</span>
    </button>
    <button type="button" class="chip" id="chip-pants" title="将当前裤装加入购物车">
      <span class="chip-k">裤装</span>
      <span class="chip-v" id="pants-name">沙色摇粒绒束脚裤</span>
    </button>
    <button type="button" class="add-btn" id="add-btn">加入购物车</button>
  </footer>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="cart-drawer" role="dialog" aria-labelledby="cart-title" aria-modal="true" hidden>
    <div class="drawer-head">
      <h2 id="cart-title">购物车</h2>
      <button type="button" class="icon-btn" id="close-cart" aria-label="关闭购物车">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="drawer-body" id="cart-list"></div>
    <div class="drawer-foot" id="cart-foot">
      <p class="demo-note">价格为虚构演示，仅供展示</p>
      <div class="total-row">
        <span>合计</span>
        <span id="cart-total">€0</span>
      </div>
      <button type="button" class="checkout-btn" id="checkout-btn">结算</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
